<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="[##cms.seo.description##]">
    <meta name="robots" content="index, nofollow" />
    <basis core="dbsource" source="hosting" name="tag" urlid="[##cms.seo.urlid##]">
        <member type="list" name="list" request="taglist"></member>
    </basis>
    <basis core="print" datamembername="tag.list">
        <face filter="key='canonical'">
            <link rel="canonical" href="@value" />
        </face>
        <face>
            <meta property="@key" content="@value" />
        </face>
    </basis>
    <title>[##cms.seo.title##]</title>
    <link href="[##cms.cms.cdn##]/booking/css/book.ui.min.css?ver=1" type="text/css" rel="stylesheet" />
</head>

<body class="book-bg-specialcolor-1">
    <!-- Header -->
    <basis core="call" file="header.inc" lid="1" pageindex="[##cms.cms.pageindex|(1)##]"></basis>
    <!-- Main-->
    <main>
        <!-- Commands / Requests -->




        <basis core="api" name="api.reserve"
    url="http://185.44.36.51:1550/api/bus/reserve"
    method="post" content-type="application/json" 
    run="atclient" if="{##cms.url##}" triggers="cms.url" body='{
    "sessionId": "[##cms.form.SessionId##]",
    "busId": "[##cms.form.busId##]",
    "busGroup": [##cms.form.busGroup##],
    "travelers": [##cms.form.Travelers##],
    "account": [##cms.form.account##],
    "agencycountername": "[##cms.form.agencycountername##]",
    "agencycounter": "[##cms.form.agencycounter##]",
    "rkey": "[##cms.cookie.rkey##]",
    "clear": "[##cms.form.clear##]",
    "accounttype": "[##cms.form.accounttype##]",
    "lid": "[##cms.query.lid|(1)##]",
    "mid": "[##cms.form.mid##]"
    "share": "0",
}'>
</basis>






        <basis core="callback" run="atclient" triggers="api.reserve" method="setReserve">
        </basis>


        <basis core="api" name="api.issue-ticket" url="http://185.44.36.51:1550/api/bus/issue-ticket" method="post"
    content-type="application/json" run="atclient" triggers="cms.issueTicket cms.url"  if="{##cms.issueTicket.run|(false)##}" 
    body='{
                "SessionId": "[##cms.form.SessionId##]",
                "BasisFlyBookId": "{##cms.issueTicket.bookId##}",
                "dmnid": "[##cms.cms.domainid##]",
                "rkey": "[##cms.cookie.rkey##]"
}'>
</basis>

        <basis core="callback" run="atclient" triggers="api.issue-ticket" method="setIssueTicket">
        </basis>
        <basis core="api" name="api.safarmarket"
            url="https://safarmarket.com/api/v1/trace/pixel/{provider_name}/3/?smId=" [##cms.cookie.safarmarketId##]"&pn
            r="{##cms.safarmarket.pnr##}" &fliNo="{##cms.safarmarket.fliNo##}" &typ="{##cms.safarmarket.typ##}"
            &pri="{##cms.safarmarket.pri##}" &pax="{##cms.safarmarket.pax##}" &adu=" {##cms.safarmarket.adu##}"
            &chi="{##cms.safarmarket.chi##}" &inf="{##cms.safarmarket.inf##}" &from="{##cms.safarmarket.from##}"
            &to="{##cms.safarmarket.to##}" &dep="{##cms.safarmarket.dep##}" &ret="{##cms.safarmarket.ret##}"
            &nam="{##cms.safarmarket.nam##}" &pho="{##cms.safarmarket.pho##}" &ema="{##cms.safarmarket.ema##}"
            &rFTyp="{##cms.safarmarket.rFTyp##}" &rPnr=" {##cms.safarmarket.rPnr##}"
            &rFliNo="{##cms.safarmarket.rFliNo##}" &bck=false" method="get" content-type="application/json"
            run="atclient" triggers="cms.safarmarket" if="{##cms.safarmarket.run|(false)##}">
        </basis>
        <div class="book-layout__main book-max-w-7xl book-mx-auto" data-id="{##cms.token.bookId##}">
            <div class="book-message__booking__container book-w-full book-text-center book-my-10 book-py-10">
                <div class="book__first__message__content">
                    <div class="book-final__loader book-mx-auto"></div>
                    <div class="book-text-2xl book-font-bold book-mt-6">در
                        حال صدور پیش رزرو<basis core="group" name="bank-type"
                            if="'[##cms.form.bankIdentifier##]'not in ('-1','-') "> و
                            انتقال به بانک </basis>...</div>
                </div>
                <div class="book__last__message__content book-hidden">
                    <div class="book__last__message book-text-2xl book-font-bold book-mt-6">
                    </div>
                    <div class="book-mt-6">
                        <button onclick="window.location='/'"
                            class="book-min-w-48 book-text-white book-bg-primary-400 book-border book-border-solid book-border-primary-400 book-rounded-lg book-p-3 hover:book-bg-white hover:book-text-primary">بازگشت
                            به صفحه اصلی</button>
                    </div>
                </div>
            </div>
            <basis core="group" name="invoice-type" if="'[##cms.form.accounttype##]' <> '1'">
                <basis core="group" name="pay-type" if="'[##cms.form.payType##]' <> 'credit'">
                    <basis core="group" name="bank-type" if="'[##cms.form.bankIdentifier##]' <> '-1'">
                        <basis core="dbsource" source="hosting" name="db">
                            <member name="siteaddress" type="list" request="siteaddress" />
                        </basis>
                        <basis core="external.fly.ws" source="cmsDbService2" name="db" procedurename="dbsource">
                            <member method="cms" name="webservice_detail" query='{
                                "name": "db",
                                "mid": "20",
                                "member": [
                                    {
                                        "name": "q",
                                        "type": "list",
                                        "request": "webservice_Detail",
                                        "id": [##cms.form.bankIdentifier##],
                                        "dmnid": [##cms.cms.domainid##],
                                        "lid":"1"
                                    }
                                ]
                            }' />
                        </basis>
                        <basis core="group" name="Delay_1">
                            <basis core="inlinesource" name="db">
                                <member name="bankid" format="json"
                                    postsql="select value from [db.bankid] where field = 'bankid'">
                                    {"root":[##db.webservice_detail.result##]}
                                </member>
                            </basis>
                            <basis core="api" name="api.token" run="atclient" triggers="cms.token"
                                if="{##cms.token.run|(false)##}"
                                url='https://basisfly.com/pay/Token/[##cms.cookie.rkey##]' method="post" body='{
                                "bankid": [##db.bankid.Value##],
                                "factorid": {##cms.token.bookId##},
                                "site_url": "[##db.siteaddress.domain##]",
                                "callback_url": "book/callback",
                                "mobile": "{##cms.token.accountMobile##}",
                                "email": "{##cms.token.accountEmail##}",
                                "description": "booking",
                                "tax_amount": "0",
                                "discount_amount": "0",
                                "cart_items": {
                                    "title": "",
                                    "source": "",
                                    "destination": "",
                                    "service_type": "",
                                    "travel_type": ""
                                }
                            }'></basis>
                            <basis core="callback" run="atclient" triggers="api.token" method="setToken"></basis>
                        </basis>
                    </basis>
                </basis>
            </basis>


        </div>
    </main>
    <!-- Footer -->
    <basis core="call" file="footer.inc" lid="1" pageindex="[##cms.cms.pageindex|(1)##]"></basis>
    <script>

        /**
 * Initialized as null to be populated on DOM load.
 */
        // Validate templating placeholders
        const accounttype = "[##cms.form.accounttype##]";
        const payType = "[##cms.form.payType##]";
        const bankIdentifier = "[##cms.form.bankIdentifier##]";
        const schemaId = "[##cms.form.Schemaid##]";
        const sessionId = "[##cms.form.SessionId##]";
        const busGroup = JSON.parse(`[##cms.form.busGroup##]`);
        const accountData = JSON.parse(`[##cms.form.account##]`);
        const TravelersData = JSON.parse(`[##cms.form.Travelers##]`);
        const email = accountData.agencyemail || accountData.email || "";
        const mobile = accountData.agencymobile || accountData.mobile || "";
        const fullname = `${TravelersData[0].FirstName} ${TravelersData[0].LastName}`;
        document.addEventListener("DOMContentLoaded", function () {
            if (queryUrl === "test") {
                $bc.setSource("cms.url", "[##cms.host.test##]")
            } else {
                $bc.setSource("cms.url", "[##cms.host.live##]");
            }
            localStorage.removeItem("busSearch");
            localStorage.removeItem("busBook");
            localStorage.removeItem("busAmenities");
        })
        /**
       * Processes booking API response, handles price changes, and initiates ticket issuance or payment.
       * @param {Object} args - API response object containing source data with status, price change, and book ID.
       */
        const setReserve = async (args) => {
            try {
                // Validate API response
                const response = args.source?.rows?.[0];
                if (!response || response.Status === undefined) {
                    throw new Error("Invalid or missing API response data");
                }

                const responseStatus = response.Status;
                const responseErrorMessage = response.ErrorMessage || "خطایی رخ داده است";
                const responseContainer = document.querySelector(".book-message__booking__container");
                if (!responseContainer) {
                    throw new Error("Response container not found");
                }

                const responseFirst = responseContainer.querySelector(".book__first__message__content");
                const responseLast = responseContainer.querySelector(".book__last__message__content");
                if (!responseLast) {
                    throw new Error("Last message content element not found");
                }
                const lastMessage = responseLast.querySelector(".book__last__message");
                if (!lastMessage) {
                    throw new Error("Last message element not found");
                }

                if (responseStatus === true) {

                    const priceChange = response.PriceChange;
                    const bookId = response.AirReservation?.BasisFlyBookId;
                    if (!bookId) {
                        throw new Error("Book ID not found in response");
                    }
                    // Chack safarmarket api
                    if (bankIdentifier == '') {
                        $bc.setSource("cms.safarmarket", [{
                            pnr: bookId,
                            fliNo: busGroup[0].RoutesInfo[0].busNumber,
                            typ: busGroup[0].isSystembus === "true" || busGroup[0].isSystembus === true ? "SYSTEM" : "CHARTER",
                            pri: PriceInfo.PassengerFare[0].Unit,
                            pax: PriceInfo.TotalCommission,
                            adu: PriceInfo.PassengerFare.find(p => p.passengerType === "Adult")?.Count || 0,
                            chi: PriceInfo.PassengerFare.find(p => p.passengerType === "Child")?.Count || 0,
                            inf: PriceInfo.PassengerFare.find(p => p.passengerType === "Infant")?.Count || 0,
                            from: busGroup[0].RoutesInfo[0].OriginAirport,
                            to: busGroup[0].RoutesInfo[0].DestinationAirport,
                            dep: `${busGroup[0].RoutesInfo[0].DepartureDate} ${busGroup[0].RoutesInfo[0].DepartureTime}`,
                            ret: busGroup.length > 1 ? `${busGroup[1].RoutesInfo[0].DepartureDate} ${busGroup[1].RoutesInfo[0].DepartureTime}` : "",
                            nam: fullname,
                            pho: mobile,
                            ema: email,
                            rFTyp: busGroup[1] ? (busGroup[1].isSystembus === "true" || busGroup[1].isSystembus === true ? "SYSTEM" : "CHARTER") : "",
                            rPnr: bookId,
                            rFliNo: busGroup[1] && busGroup[1].RoutesInfo && busGroup[1].RoutesInfo[0] ? busGroup[1].RoutesInfo[0].busNumber : "",
                            run: true
                        }]);



                    };
                    if (priceChange === null) {
                        // No price change, proceed with booking
                        confirmBookingProcesse(bookId, `${responseErrorMessage}`);
                    } else {
                        // Display price change confirmation UI
                        if (responseFirst) {
                            responseFirst.classList.add("book-hidden");
                        }
                        responseLast.classList.remove("book-hidden");
                        lastMessage.innerHTML = `
                    <div class="book-price__changed">تغییر قیمت اتفاق افتاده ,مایل به ادامه فرآیند رزرو با مبلغ 
                    ${new Intl.NumberFormat().format(priceChange)} هستید؟</div>
                    <button class="book-mx-2 book-bg-green-600 book-mt-4 book-text-white  book-rounded-lg book-p-2 book-min-w-28" onclick="confirmBookingProcesse('${bookId}','${responseErrorMessage}')">بله, ادامه میدم</button>
                    <button class="book-mx-2 book-bg-red-500 book-mt-4 book-text-white  book-rounded-lg book-p-2 book-min-w-28" onclick="rejectBookingProcesse()">خیر, منصرف شدم</button>`;
                    }
                } else {
                    // Display error message
                    if (responseFirst) {
                        responseFirst.classList.add("book-hidden");
                    }
                    responseLast.classList.remove("book-hidden");
                    lastMessage.textContent = responseErrorMessage;
                }
            } catch (err) {
                console.error(`setReserve: ${err.message}, Line: ${err.lineNumber || 'unknown'}`);
            }
        };

        /**
         * Confirms price change or booking and triggers ticket issuance or payment gateway.
         * @param {string} bookId - The booking ID for ticket issuance.
         */
        const confirmBookingProcesse = async (bookId, responseErrorMessage, priceChange) => {
            try {
                const share = "[##cms.form.share##]";
                // Validate DOM elements
                const responseContainer = document.querySelector(".book-message__booking__container");
                if (!responseContainer) {
                    throw new Error("Response container not found");
                }
                const responseFirst = responseContainer.querySelector(".book__first__message__content");
                const responseLast = responseContainer.querySelector(".book__last__message__content");
                if (!responseLast) {
                    throw new Error("Last message content element not found");
                }
                const lastMessage = responseLast.querySelector(".book__last__message");
                if (!lastMessage) {
                    throw new Error("Last message element not found");
                }


                if (!accounttype || !bankIdentifier) {
                    throw new Error("Missing required templating placeholders");
                }
                if (Number(accounttype) === 1) {
                    console.log('Account type 1: Processing contract');
                    if (responseFirst) {
                        responseFirst.classList.add("book-hidden");
                    }
                    responseLast.classList.remove("book-hidden");
                    // Note: responseErrorMessage is undefined here; assuming it's a global or passed variable
                    lastMessage.innerHTML = `پیش رزرو شما با موفقیت انجام شد`;
                } else {
                    console.log('Account type not 1: Checking payment type');
                    if (payType === 'credit') {
                        console.log('Payment type credit: Issuing ticket');
                        if (responseFirst) {
                            responseFirst.classList.add("book-hidden");
                        }
                        responseLast.classList.remove("book-hidden");
                        lastMessage.innerHTML = `<div class="book-final__loader"></div><div>در حال صدور رزرو...</div>`;
                        $bc.setSource("cms.issueTicket", [{
                            bookId: bookId,
                            run: true
                        }]);
                    } else {
                        if (Number(share) === 1) {
                            console.log('Payment type share: Issuing ticket');
                            if (responseFirst) {
                                responseFirst.classList.add("book-hidden");
                            }
                            responseLast.classList.remove("book-hidden");
                            lastMessage.innerHTML = `<div class="book-final__loader"></div><div>در حال صدور رزرو...</div>`;
                            $bc.setSource("cms.issueTicket", [{
                                bookId: bookId,
                                run: true
                            }]);

                        } else {
                            console.log('Payment type not credit: Checking bank identifier');
                            if (bankIdentifier === '-1') {
                                console.log('Bank identifier -1: Displaying contract');
                                if (responseFirst) {
                                    responseFirst.classList.add("book-hidden");
                                }
                                responseLast.classList.remove("book-hidden");
                                lastMessage.innerHTML = `پیش رزرو شما با موفقیت انجام شد`;
                            } else {
                                console.log('Bank identifier not -1: Initiating payment');
                                if (!accountData) {
                                    throw new Error("Invalid account data format");
                                }

                                $bc.setSource("cms.token", [{
                                    bookId: bookId,
                                    accountEmail: email,
                                    accountMobile: mobile,
                                    run: true
                                }]);
                            }
                        }
                    }
                }
            } catch (err) {
                console.error(`confirmBookingProcesse: ${err.message}, Line: ${err.lineNumber || 'unknown'}`);
            }
        };

        /**
         * Rejects price change or booking and redirects to the homepage.
         */
        const rejectBookingProcesse = async () => {
            try {
                window.location.href = '/';
            } catch (err) {
                console.error(`rejectBookingProcesse: ${err.message}, Line: ${err.lineNumber || 'unknown'}`);
            }
        };

        /**
         * Processes ticket issuance API response and updates UI with status or error message.
         * @param {Object} args - API response object containing source data with status and error message.
         */
        const setIssueTicket = async (args) => {
            try {
                // Validate API response
                const response = args.source?.rows?.[0];
                const responseStatus = response.Status;
                if (!response || response.Status === undefined) {
                    throw new Error("Invalid or missing API response data");
                }

                // Validate DOM elements
                const responseContainer = document.querySelector(".book-message__booking__container");
                if (!responseContainer) {
                    throw new Error("Response container not found");
                }
                const responseLast = responseContainer.querySelector(".book__last__message__content");
                if (!responseLast) {
                    throw new Error("Last message content element not found");
                }
                const lastMessage = responseLast.querySelector(".book__last__message");
                if (!lastMessage) {
                    throw new Error("Last message element not found");
                }
                // Display error message
                if (responseStatus === true) {
                    lastMessage.textContent = `رزرو شما با موفقیت انجام شد`;
                } else {
                    lastMessage.textContent = response.ErrorMessage || "خطایی رخ داده است";
                }


            } catch (err) {
                console.error(`setIssueTicket: ${err.message}, Line: ${err.lineNumber || 'unknown'}`);
            }
        };

        /**
         * Processes payment gateway token API response and initiates payment form submission or redirect.
         * @param {Object} args - API response object containing source data with URL, method, and form.
         */
        const setToken = async (args) => {
            try {
                // Validate DOM elements
                const responseContainer = document.querySelector(".book-message__booking__container");
                if (!responseContainer) {
                    throw new Error("Response container not found");
                }
                const responseLast = responseContainer.querySelector(".book__last__message__content");
                if (!responseLast) {
                    throw new Error("Last message content element not found");
                }
                const lastMessage = responseLast.querySelector(".book__last__message");
                if (!lastMessage) {
                    throw new Error("Last message element not found");
                }

                // Validate API response
                const source = args.source?.rows;
                if (!source || !source[0]) {
                    throw new Error("Source data not found");
                }


                if (!bankIdentifier || !payType || !schemaId || !sessionId) {
                    throw new Error("Missing required templating placeholders");
                }

                // Get bookId from DOM
                const layoutMain = document.querySelector(".book-layout__main");
                const bookId = layoutMain?.dataset.id;
                if (!bookId) {
                    throw new Error("Book ID not found in DOM dataset");
                }

                if (source[0].url_gateway) {
                    // Initiate payment gateway request
                    const safarmarketURL = bankIdentifier === "5"
                        ? `https://safarmarket.com/api/v1/trace/pixel/${providerName}/3/` +
                        `?smId=[##cms.cookie.safarmarketId##]` +
                        `&pnr=${encodeURIComponent(bookId)}` +
                        `&fliNo=${encodeURIComponent(busGroup[0].RoutesInfo[0].busNumber)}` +
                        `&typ=${encodeURIComponent(
                            busGroup[0].isSystembus === "true" || busGroup[0].isSystembus === true
                                ? "SYSTEM" : "CHARTER"
                        )}` +
                        `&pri=${encodeURIComponent(PriceInfo.PassengerFare[0].Unit)}` +
                        `&pax=${encodeURIComponent(PriceInfo.TotalCommission)}` +
                        `&adu=${encodeURIComponent(
                            PriceInfo.PassengerFare.find(p => p.passengerType === "Adult")?.Count || 0
                        )}` +
                        `&chi=${encodeURIComponent(
                            PriceInfo.PassengerFare.find(p => p.passengerType === "Child")?.Count || 0
                        )}` +
                        `&inf=${encodeURIComponent(
                            PriceInfo.PassengerFare.find(p => p.passengerType === "Infant")?.Count || 0
                        )}` +
                        `&from=${encodeURIComponent(busGroup[0].RoutesInfo[0].OriginAirport)}` +
                        `&to=${encodeURIComponent(busGroup[0].RoutesInfo[0].DestinationAirport)}` +
                        `&dep=${encodeURIComponent(
                            `${busGroup[0].RoutesInfo[0].DepartureDate} ${busGroup[0].RoutesInfo[0].DepartureTime}`
                        )}` +
                        `&ret=${encodeURIComponent(
                            busGroup.length > 1
                                ? `${busGroup[1].RoutesInfo[0].DepartureDate} ${busGroup[1].RoutesInfo[0].DepartureTime}`
                                : ""
                        )}` +
                        `&nam=${encodeURIComponent(fullname)}` +
                        `&pho=${encodeURIComponent(mobile)}` +
                        `&ema=${encodeURIComponent(email)}` +
                        `&rFTyp=${encodeURIComponent(
                            busGroup[1]
                                ? (busGroup[1].isSystembus === "true" || busGroup[1].isSystembus === true
                                    ? "SYSTEM" : "CHARTER")
                                : ""
                        )}` +
                        `&rPnr=${encodeURIComponent(bookId)}` +
                        `&rFliNo=${encodeURIComponent(
                            busGroup[1]?.RoutesInfo?.[0]?.busNumber || ""
                        )}` +
                        `&bck=false`
                        : "";

                    const response = await fetch("/book/saveInput", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded",
                        },
                        body: new URLSearchParams({
                            bankIdentifier,
                            payType,
                            schemaid: schemaId,
                            sessionId,
                            bookId,
                            session: source[0].session,
                            orderid: source[0].orderid,
                            safarmarketURL

                        })
                    });
                    const result = await response.text();

                    if (source[0].method === 'POST') {
                        // Submit payment form
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = source[0].form;
                        const form = tempDiv.querySelector('form');
                        if (!form) {
                            throw new Error("Payment form not found");
                        }
                        document.body.appendChild(form);
                        form.submit();
                    } else {
                        // Redirect to gateway URL
                        window.location = source[0].url_gateway;
                    }
                    if (document.querySelector(".book-price__changed")) {
                        lastMessage.insertAdjacentHTML("beforeend", `<div class="book__final__message__content book-my-10"><div class="book-final__loader book-mx-auto book-mb-10"></div><div>در حال اتصال به درگاه بانک...</div></div>`);
                    }
                } else {
                    // Display error if no gateway URL
                    lastMessage.textContent = 'امکان اتصال به درگاه پرداخت الکترونیک وجود ندارد.';
                }
            } catch (err) {
                console.error(`setToken: ${err.message}, Line: ${err.lineNumber || 'unknown'}`);
            }
        };

    </script>
</body>

</html>
