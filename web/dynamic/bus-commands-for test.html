<!-- CreateSession -->
<basis core="api" name="api.session" url="http://185.44.36.51:1550/api/bus/CreateSession" method="post"
	content-type="application/json" run="atclient" body='{
            "rkey": "[##cms.cookie.rkey##]",
            "dmnid": "2475"
        }'>
</basis>

<basis core="callback" triggers="api.session" run="atclient" method="setSession"></basis>


<!-- /[{"Origin":"1203548","Destination":"1203561","OriginName":"تهران","DestinationName":"رشت","DepartureDate":"2025-06-10"}] -->
<basis core="api" name="bus.search" url="http://185.44.36.51:1550/api/bus/search" method="post" if="{##cms.rule##}"
	triggers="cms.rule" content-type="application/json" run="atclient" body='{
  "tripGroup": [
    {
      "origin": "1203548",
      "destination": "1203561",
      "departureDate": "2025-06-10"
    }
  ],
  "rKey": "[##cms.cookie.rkey##]",
  "dmnid": 2475,
  "sessionId": "{##cms.rule.SessionId##}",
  "lid": 1
}'>
</basis>
<basis core="callback" triggers="bus.search cms.page cms.nextpage cms.prevpage" run="atclient" method="formatBusData"></basis>

<!-- available-seat -->
<basis core="api" name="bus.available-seat" url="http://185.44.36.51:1550/api/bus/available-seat" method="post"
    if="{##cms.seat##} " triggers="cms.seat" content-type="application/json" run="atclient" body='{
    "busId": "{##cms.seat.busId##}",
    "busGroup": "{##cms.seat.busGroup##}",
    "rKey": "[##cms.cookie.rkey##]", 
    "dmnid":  "{##cms.rule.dmnid##}",
    "sessionId": "{##cms.rule.SessionId##}",
    "lid": "{##cms.rule.lid##}"
}'>
</basis>
