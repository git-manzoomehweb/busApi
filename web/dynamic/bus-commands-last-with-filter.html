<!-- CreateSession -->
<basis core="api" name="api.session" url="http://185.44.36.51:1550/api/bus/CreateSession" method="post"
    content-type="application/json" run="atclient" body='{
            "rkey": "[##cms.cookie.rkey##]",
            "dmnid": "[##cms.cms.domainid##]"
        }'>
</basis>

<basis core="callback" triggers="api.session" run="atclient" method="setSession"></basis>

<basis core="api" name="bus.search" url="http://185.44.36.51:1550/api/bus/search" method="post" 
if="{##cms.rule.run|(false)##}"
    triggers="cms.rule" 
    content-type="application/json" run="atclient" body='{
  "tripGroup": {##cms.rule.TripGroup##},
  "rKey": "[##cms.cookie.rkey##]",
  "dmnid":  {##cms.rule.dmnid##},
  "sessionId": "{##cms.rule.SessionId##}",
  "lid": {##cms.rule.lid##}
}'>
</basis>


<basis core="callback" run="atclient"
    triggers="bus.search cms.page cms.nextpage cms.prevpage cms.company cms.outboundcompany cms.inboundcompany cms.terminal cms.outboundterminal cms.inboundterminal cms.stop cms.outboundstop cms.inboundstop cms.busnumber cms.outboundbusnumber cms.inboundbusnumber
      cms.departuretime cms.outbounddeparturetime cms.inbounddeparturetime cms.outboundhour cms.inboundhour cms.hour cms.systembus cms.price cms.sort cms.bus"
    method="busManipulation">
</basis>


<!-- available-seat -->
<basis core="api" name="bus.available-seat" url="http://185.44.36.51:1550/api/bus/available-seat" method="post"
    if="{##cms.seat.run|(false)##} " triggers="cms.seat" 
    content-type="application/json" run="atclient" body='{
    "busId": "{##cms.seat.busId##}",
    "busGroup": {##cms.seat.busGroup##},
    "rKey": "[##cms.cookie.rkey##]", 
    "dmnid":  {##cms.rule.dmnid##},
    "sessionId": "{##cms.rule.SessionId##}",
    "lid": "{##cms.rule.lid##}"
}' onprocessed='onProcessedRenderSeatMap'>
</basis>

<!-- bus_rules -->
<basis core="api" name="bus.rules" url="http://185.44.36.51:1550/api/bus/bus-rules" method="post" 
    if="{##cms.seat.run|(false)##} " triggers="cms.seat" 
    content-type="application/json" run="atclient" body='{
    "busId": "{##cms.seat.busId##}",
    "busGroup": {##cms.seat.busGroup##},
    "rKey": "[##cms.cookie.rkey##]", 
    "dmnid":  {##cms.rule.dmnid##},
    "sessionId": "{##cms.rule.SessionId##}",
    "lid": "{##cms.rule.lid##}"
}'  onprocessed='onProcessedRenderBusRules' >
</basis>
